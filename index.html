<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz App</title>
  <meta name="description" content="A tiny vanilla JS multiple-choice quiz app." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>🧠 Quiz App</h1>
    </header>

    <section id="start-screen" class="screen">
      <p class="lead">
        Test your knowledge with <strong id="question-count">0</strong> questions.
      </p>
      <ul class="rules">
        <li>Pick one answer per question</li>
        <li>You get instant feedback</li>
        <li>Answers are shuffled every round</li>
        <li>
          Keyboard: <kbd>1</kbd>–<kbd>4</kbd> to answer,
          <kbd>Enter</kbd> for next
        </li>
      </ul>
      <button id="start-btn" class="btn btn-primary" type="button">Start Quiz</button>
    </section>

    <section id="quiz-screen" class="screen hidden">
      <div class="quiz-top">
        <span id="progress-text">Question 1 of 10</span>
        <span id="score-text">Score: 0</span>
      </div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <h2 id="question-text" class="question"></h2>
      <div id="options" class="options"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>

      <div class="quiz-actions">
        <button id="next-btn" class="btn btn-primary" type="button" disabled>Next</button>
      </div>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
