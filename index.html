<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz App</title>
  <meta name="description" content="A tiny vanilla JS multiple-choice quiz app." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>🧠 Quiz App</h1>
    </header>

    <section id="start-screen" class="screen">
      <p class="lead">
        Test your knowledge with <strong id="question-count">0</strong> questions.
      </p>
      <ul class="rules">
        <li>Pick one answer per question</li>
        <li>You get instant feedback</li>
        <li>Answers are shuffled every round</li>
        <li>
          Keyboard: <kbd>1</kbd>–<kbd>4</kbd> to answer,
          <kbd>Enter</kbd> for next
        </li>
      </ul>
      <button id="start-btn" class="btn btn-primary" type="button">Start Quiz</button>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
